{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Job Portal</title>

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #f1f5f9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    background: #fff;
    padding: 40px 30px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    width: 350px;
  }

  .container h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #0f172a;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 15px;
  }

  .input-group label {
    margin-bottom: 5px;
    font-weight: 500;
  }

  .input-group input {
    padding: 10px;
    border: 1px solid #cbd5e1;
    border-radius: 5px;
    outline: none;
    transition: border-color 0.3s;
  }

  .input-group input:focus {
    border-color: #38bdf8;
  }

  .btn {
    width: 100%;
    padding: 10px;
    background: #38bdf8;
    color: #fff;
    border: none;
    border-radius: 5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.3s;
  }

  .btn:hover {
    background: #0284c7;
  }

  .login-text {
    text-align: center;
    margin-top: 15px;
  }

  .login-text a {
    color: #38bdf8;
    text-decoration: none;
    font-weight: 500;
  }

  .login-text a:hover {
    text-decoration: underline;
  }

  .error {
    background: #f8d7da;
    color: #721c24;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 6px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="container">
    <h2>Login to Your Account</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="error">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="input-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>

        <button type="submit" class="btn">Login</button>

        <p class="login-text">
            Don't have an account? <a href="{% url 'register' %}">Register</a>
        </p>
    </form>
</div>

</body>
</html>
